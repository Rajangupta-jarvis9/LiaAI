name: Build LiaAI APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:          # manual trigger from Actions tab

jobs:
  build:
    name: Build Debug + Release APKs
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── 2. Java 17 ────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle cache ───────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 4. Gradle wrapper permission ──────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── 5. Patch themes.xml — replace Material theme with AppCompat ───────
      # android:Theme.Material.NoTitleBar causes AAPT linking failure on CI.
      # Compose apps do not need it; Theme.AppCompat.NoActionBar is correct.
      - name: Patch themes.xml
        run: |
          sed -i 's|android:Theme.Material.NoTitleBar|Theme.AppCompat.NoActionBar|g' \
            app/src/main/res/values/themes.xml
          echo "── themes.xml after patch ──"
          cat app/src/main/res/values/themes.xml

      # ── 6. Remove non-font files from res/font/ ───────────────────────────
      - name: Clean res/font directory
        run: find app/src/main/res/font -type f ! \( -name "*.xml" -o -name "*.ttf" -o -name "*.ttc" -o -name "*.otf" \) -delete && echo "Cleaned font dir" || true

      # ── 6. Build unsigned APKs (no keystore needed) ───────────────────────
      # direct = full power flavor, play = Play Store safe flavor
      - name: Build directDebug APK
        run: ./gradlew assembleDirectDebug --no-daemon

      - name: Build playDebug APK
        run: ./gradlew assemblePlayDebug --no-daemon

      # ── 6. Collect APKs ───────────────────────────────────────────────────
      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/direct/debug/app-direct-debug.apk \
             artifacts/LiaAI-direct-debug.apk
          cp app/build/outputs/apk/play/debug/app-play-debug.apk \
             artifacts/LiaAI-play-debug.apk
          echo "── APKs ready ──"
          ls -lh artifacts/

      # ── 7. Upload ─────────────────────────────────────────────────────────
      - name: Upload directDebug APK
        uses: actions/upload-artifact@v5
        with:
          name: LiaAI-direct-debug
          path: artifacts/LiaAI-direct-debug.apk
          retention-days: 30

      - name: Upload playDebug APK
        uses: actions/upload-artifact@v5
        with:
          name: LiaAI-play-debug
          path: artifacts/LiaAI-play-debug.apk
          retention-days: 30
