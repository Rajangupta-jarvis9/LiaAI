[versions]
agp                     = "8.7.3"
kotlin                  = "2.0.21"
coreKtx                 = "1.13.1"
coreSplashscreen        = "1.0.1"
activityCompose         = "1.9.3"
lifecycleRuntimeKtx     = "2.8.7"
composeBom              = "2024.12.01"
navigationCompose       = "2.8.5"
coroutines              = "1.9.0"
datastore               = "1.1.1"
okhttp                  = "4.12.0"
webkit                  = "1.12.1"
material-icons-extended = "1.7.6"
junit                   = "4.13.2"
orgJson                 = "20240303"

[libraries]
core-ktx                     = { group = "androidx.core",            name = "core-ktx",                             version.ref = "coreKtx" }
core-splashscreen            = { group = "androidx.core",            name = "core-splashscreen",                    version.ref = "coreSplashscreen" }
activity-compose             = { group = "androidx.activity",        name = "activity-compose",                     version.ref = "activityCompose" }
lifecycle-runtime-ktx        = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",                version.ref = "lifecycleRuntimeKtx" }
lifecycle-runtime-compose    = { group = "androidx.lifecycle",       name = "lifecycle-runtime-compose",            version.ref = "lifecycleRuntimeKtx" }
lifecycle-viewmodel-compose  = { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-compose",          version.ref = "lifecycleRuntimeKtx" }
compose-bom                  = { group = "androidx.compose",         name = "compose-bom",                          version.ref = "composeBom" }
compose-ui                   = { group = "androidx.compose.ui",      name = "ui" }
compose-ui-graphics          = { group = "androidx.compose.ui",      name = "ui-graphics" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui",      name = "ui-tooling-preview" }
compose-ui-tooling           = { group = "androidx.compose.ui",      name = "ui-tooling" }
compose-ui-test-manifest     = { group = "androidx.compose.ui",      name = "ui-test-manifest" }
material3                    = { group = "androidx.compose.material3", name = "material3" }
material-icons-extended      = { group = "androidx.compose.material", name = "material-icons-extended",            version.ref = "material-icons-extended" }
navigation-compose           = { group = "androidx.navigation",      name = "navigation-compose",                   version.ref = "navigationCompose" }
coroutines-android           = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android",           version.ref = "coroutines" }
coroutines-test              = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-test",              version.ref = "coroutines" }
datastore-preferences        = { group = "androidx.datastore",       name = "datastore-preferences",                version.ref = "datastore" }
okhttp                       = { group = "com.squareup.okhttp3",     name = "okhttp",                               version.ref = "okhttp" }
webkit                       = { group = "androidx.webkit",          name = "webkit",                               version.ref = "webkit" }
junit                        = { group = "junit",                    name = "junit",                                version.ref = "junit" }
mockito-kotlin               = { group = "org.mockito.kotlin",       name = "mockito-kotlin",                       version = "5.4.0" }
mockwebserver                = { group = "com.squareup.okhttp3",     name = "mockwebserver",                        version.ref = "okhttp" }
org-json                     = { group = "org.json",                 name = "json",                                 version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",          version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
