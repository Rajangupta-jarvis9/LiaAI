name: Build LiaAI APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:          # manual trigger from Actions tab

jobs:
  build:
    name: Build Debug + Release APKs
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle cache ───────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 4. Gradle wrapper permission ──────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── 5. Keystore setup (release signing) ───────────────────────────────
      # Secrets needed in repo Settings → Secrets → Actions:
      #   KEYSTORE_BASE64    → base64 of your lia-release.jks
      #   KEY_ALIAS          → lia  (or whatever you set)
      #   KEY_PASSWORD       → your key password
      #   STORE_PASSWORD     → your store password
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > lia-release.jks

      - name: Write keystore.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > keystore.properties << EOF
          storeFile=../lia-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      # ── 6. Build ALL four APKs ────────────────────────────────────────────
      # direct flavor  → full power (AccessibilityService, visual agents)
      # play flavor    → Play Store compliant (restricted permissions)
      - name: Build directDebug APK
        run: ./gradlew assembleDirectDebug --no-daemon

      - name: Build directRelease APK
        run: ./gradlew assembleDirectRelease --no-daemon

      - name: Build playDebug APK
        run: ./gradlew assemblePlayDebug --no-daemon

      - name: Build playRelease APK
        run: ./gradlew assemblePlayRelease --no-daemon

      # ── 7. Rename APKs for clarity ────────────────────────────────────────
      - name: Collect and rename APKs
        run: |
          mkdir -p artifacts
          
          # direct debug
          cp app/build/outputs/apk/direct/debug/app-direct-debug.apk \
             artifacts/LiaAI-direct-debug.apk || true
          
          # direct release
          cp app/build/outputs/apk/direct/release/app-direct-release.apk \
             artifacts/LiaAI-direct-release.apk || true
          
          # play debug
          cp app/build/outputs/apk/play/debug/app-play-debug.apk \
             artifacts/LiaAI-play-debug.apk || true
          
          # play release
          cp app/build/outputs/apk/play/release/app-play-release.apk \
             artifacts/LiaAI-play-release.apk || true
          
          echo "── Built APKs ──────────────────────────────"
          ls -lh artifacts/

      # ── 8. Upload all APKs as artifacts ───────────────────────────────────
      - name: Upload directDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiaAI-direct-debug
          path: artifacts/LiaAI-direct-debug.apk
          retention-days: 30

      - name: Upload directRelease APK
        uses: actions/upload-artifact@v4
        with:
          name: LiaAI-direct-release
          path: artifacts/LiaAI-direct-release.apk
          retention-days: 30

      - name: Upload playDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiaAI-play-debug
          path: artifacts/LiaAI-play-debug.apk
          retention-days: 30

      - name: Upload playRelease APK
        uses: actions/upload-artifact@v4
        with:
          name: LiaAI-play-release
          path: artifacts/LiaAI-play-release.apk
          retention-days: 30
